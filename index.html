<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>墨笺书阁 - 个人小说阅读</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="header" id="header">
        <div class="header-inner">
            <a href="#" class="logo" data-page="home">
                <span class="logo-icon">📖</span>
                <span class="logo-text">墨笺书阁</span>
            </a>
            <nav class="nav-links">
                <a href="#" class="nav-link active" data-page="home">书架</a>
                <a href="#" class="nav-link" data-page="categories">分类</a>
                <a href="#" class="nav-link" data-page="about">关于</a>
            </nav>
            <div class="header-actions">
                <button class="btn-icon" id="btn-search" title="搜索" aria-label="搜索">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                </button>
                <button class="btn-icon" id="btn-theme" title="切换主题" aria-label="切换主题">
                    <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
                    <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </button>
            </div>
        </div>
    </header>

    <!-- 搜索覆盖层 -->
    <div class="search-overlay" id="search-overlay">
        <div class="search-modal">
            <div class="search-input-wrap">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                <input type="text" class="search-input" id="search-input" placeholder="搜索小说名称或作者..." autofocus>
                <button class="btn-close" id="btn-search-close" aria-label="关闭搜索">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="search-results" id="search-results"></div>
        </div>
    </div>

    <!-- 主内容区 -->
    <main class="main-content" id="main-content">
        <!-- 由 JS 动态渲染 -->
    </main>

    <!-- 页脚 -->
    <footer class="footer">
        <p>&copy; 2025 墨笺书阁 · 个人小说阅读空间</p>
    </footer>

    <!-- 回到顶部 -->
    <button class="btn-back-top" id="btn-back-top" title="回到顶部" aria-label="回到顶部">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m18 15-6-6-6 6"/></svg>
    </button>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
